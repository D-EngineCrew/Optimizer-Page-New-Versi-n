
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediaForge - Optimizador</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #0d0b18;
  color: #fff;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 850px;
  margin: auto;
}

header {
  text-align: center;
  margin-bottom: 25px;
}

header h1 {
  color: #b58aff;
  margin-bottom: 8px;
}

header p {
  color: #aaa;
}

.panel {
  background: #191528;
  border: 1px solid #34264f;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 18px;
}

#drop {
  border: 2px dashed #8658c9;
  border-radius: 14px;
  padding: 35px 15px;
  text-align: center;
  cursor: pointer;
  background: #211934;
  transition: .2s;
}

#drop:hover {
  background: #302044;
}

#drop strong {
  color: #c5a3ff;
  display: block;
  font-size: 18px;
  margin-bottom: 8px;
}

#drop span {
  color: #aaa;
  font-size: 13px;
}

select, button {
  border: none;
  border-radius: 9px;
  padding: 12px;
  font-size: 14px;
}

select {
  width: 100%;
  margin-top: 10px;
  background: #292039;
  color: white;
  border: 1px solid #65458f;
}

button {
  cursor: pointer;
  background: #8658c9;
  color: white;
  font-weight: bold;
  transition: .2s;
}

button:hover {
  background: #a276e9;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.main-button {
  width: 100%;
  margin-top: 15px;
}

.secondary {
  background: #34264f;
}

.danger {
  background: #743b57;
}

.file-card {
  background: #211b30;
  border: 1px solid #403052;
  border-radius: 12px;
  padding: 14px;
  margin-top: 12px;
}

.file-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
}

.file-name {
  font-weight: bold;
  overflow-wrap: anywhere;
}

.file-info {
  font-size: 12px;
  color: #aaa;
  margin-top: 7px;
}

.file-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.file-actions button {
  flex: 1;
}

progress {
  width: 100%;
  height: 9px;
  margin-top: 12px;
  accent-color: #a276e9;
}

.status {
  font-size: 12px;
  color: #c5a3ff;
  margin-top: 8px;
}

#summary {
  color: #c5a3ff;
  margin-top: 12px;
  font-size: 13px;
}

#message {
  color: #c5a3ff;
  text-align: center;
  margin-top: 12px;
  font-size: 13px;
}

.hidden {
  display: none;
}

footer {
  text-align: center;
  color: #777;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>MediaForge</h1>
  <p>Optimizador y compresor de imágenes y videos</p>
</header>

<div class="panel">

  <div id="drop">
    <strong>＋ Seleccionar archivos</strong>
    <span>Imágenes y videos desde tu dispositivo</span>
    <br><br>
    <span>También puedes arrastrar archivos aquí</span>
  </div>

  <!-- Selector general de archivos de Android -->
  <input
    id="files"
    type="file"
    accept="*/*"
    multiple
    hidden
  >

  <label for="quality">Nivel de compresión</label>

  <select id="quality">
    <option value="high">Alta calidad</option>
    <option value="medium" selected>Media</option>
    <option value="ultra">Ultra compresión</option>
  </select>

  <button id="processAll" class="main-button" disabled>
    Comprimir todos los archivos
  </button>

  <button id="downloadZip" class="main-button secondary" disabled>
    Descargar todos en ZIP
  </button>

  <button id="clearAll" class="main-button danger" disabled>
    Limpiar archivos
  </button>

  <div id="summary"></div>
  <div id="message"></div>

</div>

<div class="panel">
  <h3>Archivos seleccionados</h3>
  <div id="fileList">
    <p style="color:#888;text-align:center">
      Todavía no has seleccionado archivos.
    </p>
  </div>
</div>

<footer>
  MediaForge · Optimizador multimedia
</footer>

</div>

<script>
const fileInput = document.getElementById("files");
const drop = document.getElementById("drop");
const fileList = document.getElementById("fileList");
const quality = document.getElementById("quality");

const processAllButton = document.getElementById("processAll");
const downloadZipButton = document.getElementById("downloadZip");
const clearAllButton = document.getElementById("clearAll");

const summary = document.getElementById("summary");
const message = document.getElementById("message");

let files = [];
let processing = false;

const presets = {
  high: {
    imageQuality: 0.85,
    videoBitrate: 2500000,
    maxWidth: 1920
  },
  medium: {
    imageQuality: 0.65,
    videoBitrate: 1200000,
    maxWidth: 1280
  },
  ultra: {
    imageQuality: 0.40,
    videoBitrate: 550000,
    maxWidth: 854
  }
};

function formatSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024)
    return (bytes / 1024).toFixed(1) + " KB";

  return (bytes / (1024 * 1024)).toFixed(2) + " MB";
}

function isMedia(file) {
  return file.type.startsWith("image/") ||
         file.type.startsWith("video/");
}

// Selector general de Android
drop.addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", event => {
  const selectedFiles = Array.from(event.target.files);

  const mediaFiles = selectedFiles.filter(isMedia);

  addFiles(mediaFiles);

  if (selectedFiles.length !== mediaFiles.length) {
    message.textContent =
      "Se omitieron los archivos que no eran imágenes o videos.";
  } else {
    message.textContent = "";
  }

  // Permite volver a seleccionar el mismo archivo
  fileInput.value = "";
});

// Arrastrar archivos
drop.addEventListener("dragover", event => {
  event.preventDefault();
  drop.style.background = "#38234f";
});

drop.addEventListener("dragleave", () => {
  drop.style.background = "#211934";
});

drop.addEventListener("drop", event => {
  event.preventDefault();
  drop.style.background = "#211934";

  const selectedFiles = Array.from(event.dataTransfer.files);
  addFiles(selectedFiles.filter(isMedia));
});

function addFiles(newFiles) {
  if (processing) return;

  newFiles.forEach(file => {
    files.push({
      id: crypto.randomUUID(),
      original: file,
      result: null,
      resultName: null,
      status: "Pendiente",
      progress: 0
    });
  });

  renderFiles();
}

function renderFiles() {
  fileList.innerHTML = "";

  if (!files.length) {
    fileList.innerHTML =
      '<p style="color:#888;text-align:center">Todavía no hay archivos.</p>';
  }

  files.forEach(item => {
    const card = document.createElement("div");
    card.className = "file-card";

    const type = item.original.type.startsWith("video/")
      ? "Video"
      : "Imagen";

    card.innerHTML = `
      <div class="file-top">
        <div class="file-name"></div>
        <span>${type}</span>
      </div>

      <div class="file-info">
        Original: ${formatSize(item.original.size)}
      </div>

      <progress max="100" value="${item.progress}"></progress>

      <div class="status">${item.status}</div>

      <div class="file-actions">
        <button class="download secondary" disabled>
          Descargar
        </button>
        <button class="remove danger">
          Eliminar
        </button>
      </div>
    `;

    card.querySelector(".file-name").textContent =
      item.original.name;

    const downloadButton = card.querySelector(".download");

    downloadButton.disabled = !item.result;

    downloadButton.addEventListener("click", () => {
      downloadFile(item);
    });

    card.querySelector(".remove").addEventListener("click", () => {
      if (processing) return;

      files = files.filter(f => f.id !== item.id);
      renderFiles();
    });

    fileList.appendChild(card);
  });

  updateControls();
}

function updateControls() {
  const hasFiles = files.length > 0;

  processAllButton.disabled = !hasFiles || processing;
  clearAllButton.disabled = !hasFiles || processing;

  downloadZipButton.disabled =
    !files.some(item => item.result) || processing;

  const completed = files.filter(item => item.result).length;

  summary.textContent =
    `${files.length} archivos · ${completed} comprimidos`;
}

function updateItem(item, status, progress) {
  item.status = status;
  item.progress = progress;

  const cards = fileList.querySelectorAll(".file-card");
  const index = files.findIndex(f => f.id === item.id);

  if (cards[index]) {
    cards[index].querySelector(".status").textContent = status;
    cards[index].querySelector("progress").value = progress;

    cards[index].querySelector(".download").disabled =
      !item.result;
  }

  updateControls();
}

function getPreset() {
  return presets[quality.value];
}

function canvasToBlob(canvas, type, quality) {
  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      if (blob) resolve(blob);
      else reject(new Error("No se pudo generar la imagen."));
    }, type, quality);
  });
}

// COMPRESIÓN DE IMÁGENES
async function compressImage(item) {
  const settings = getPreset();

  const bitmap = await createImageBitmap(item.original);

  let width = bitmap.width;
  let height = bitmap.height;

  if (width > settings.maxWidth) {
    const ratio = settings.maxWidth / width;
    width = settings.maxWidth;
    height = Math.round(height * ratio);
  }

  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;

  const context = canvas.getContext("2d");
  context.drawImage(bitmap, 0, 0, width, height);

  bitmap.close();

  updateItem(item, "Comprimiendo imagen...", 70);

  const blob = await canvasToBlob(
    canvas,
    "image/webp",
    settings.imageQuality
  );

  item.result = blob;

  const baseName = item.original.name.replace(/\.[^.]+$/, "");
  item.resultName = baseName + ".webp";

  updateItem(item, "Imagen comprimida", 100);
}

// COMPRESIÓN DE VIDEOS
async function compressVideo(item) {
  const settings = getPreset();

  if (!window.MediaRecorder ||
      !HTMLCanvasElement.prototype.captureStream) {
    throw new Error(
      "Tu navegador no permite comprimir videos con esta función."
    );
  }

  const video = document.createElement("video");

  video.muted = false;
  video.playsInline = true;
  video.preload = "metadata";

  const sourceUrl = URL.createObjectURL(item.original);
  video.src = sourceUrl;

  await new Promise((resolve, reject) => {
    video.onloadedmetadata = resolve;
    video.onerror = () => reject(
      new Error("No se pudo leer el video.")
    );
  });

  let width = video.videoWidth;
  let height = video.videoHeight;

  if (width > settings.maxWidth) {
    const ratio = settings.maxWidth / width;
    width = settings.maxWidth;
    height = Math.round(height * ratio);
  }

  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;

  const context = canvas.getContext("2d");

  const canvasStream = canvas.captureStream(30);

  let audioTracks = [];

  try {
    const sourceStream = video.captureStream
      ? video.captureStream()
      : video.mozCaptureStream
      ? video.mozCaptureStream()
      : null;

    if (sourceStream) {
      audioTracks = sourceStream.getAudioTracks();
    }
  } catch (error) {
    console.warn("No se pudo capturar el audio:", error);
  }

  const combinedStream = new MediaStream([
    ...canvasStream.getVideoTracks(),
    ...audioTracks
  ]);

  const mimeTypes = [
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm"
  ];

  const mimeType = mimeTypes.find(type =>
    MediaRecorder.isTypeSupported(type)
  );

  if (!mimeType) {
    URL.revokeObjectURL(sourceUrl);
    throw new Error("Formato de video no compatible.");
  }

  const recorder = new MediaRecorder(combinedStream, {
    mimeType,
    videoBitsPerSecond: settings.videoBitrate
  });

  const chunks = [];

  recorder.ondataavailable = event => {
    if (event.data && event.data.size > 0) {
      chunks.push(event.data);
    }
  };

  const recordingFinished = new Promise(resolve => {
    recorder.onstop = resolve;
  });

  recorder.start(500);

  let animationId;

  function drawFrame() {
    if (video.ended || video.paused) return;

    context.drawImage(video, 0, 0, width, height);

    const progress = video.duration
      ? Math.min(99, (video.currentTime / video.duration) * 100)
      : 0;

    updateItem(
      item,
      "Comprimiendo video...",
      Math.round(progress)
    );

    animationId = requestAnimationFrame(drawFrame);
  }

  video.onended = () => {
    cancelAnimationFrame(animationId);
    recorder.stop();
  };

  video.onerror = () => {
    cancelAnimationFrame(animationId);

    if (recorder.state !== "inactive") {
      recorder.stop();
    }
  };

  await video.play();
  drawFrame();

  await recordingFinished;

  canvasStream.getTracks().forEach(track => track.stop());
  combinedStream.getTracks().forEach(track => track.stop());

  const blob = new Blob(chunks, {
    type: "video/webm"
  });

  URL.revokeObjectURL(sourceUrl);

  if (!blob.size) {
    throw new Error("No se pudo generar el video.");
  }

  item.result = blob;

  const baseName = item.original.name.replace(/\.[^.]+$/, "");
  item.resultName = baseName + ".webm";

  updateItem(item, "Video comprimido", 100);
}

// PROCESAR TODOS
processAllButton.addEventListener("click", async () => {
  if (processing) return;

  processing = true;
  updateControls();

  message.textContent = "Procesando archivos...";

  for (const item of files) {
    if (item.result) continue;

    try {
      if (item.original.type.startsWith("image/")) {
        await compressImage(item);
      } else if (item.original.type.startsWith("video/")) {
        await compressVideo(item);
      }
    } catch (error) {
      console.error(error);
      updateItem(item, "Error: " + error.message, 0);
    }
  }

  processing = false;

  message.textContent = "Proceso terminado.";
  renderFiles();
});

// DESCARGAR INDIVIDUAL
function downloadFile(item) {
  if (!item.result) return;

  const url = URL.createObjectURL(item.result);
  const link = document.createElement("a");

  link.href = url;
  link.download = item.resultName;

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

// DESCARGAR ZIP
downloadZipButton.addEventListener("click", async () => {
  const completed = files.filter(item => item.result);

  if (!completed.length) return;

  message.textContent = "Preparando ZIP...";

  const zip = new JSZip();

  completed.forEach(item => {
    zip.file(item.resultName, item.result);
  });

  try {
    const blob = await zip.generateAsync({
      type: "blob",
      compression: "DEFLATE",
      compressionOptions: {
        level: 5
      }
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "MediaForge-Optimized.zip";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 5000);

    message.textContent = "ZIP generado correctamente.";
  } catch (error) {
    message.textContent = "Error al crear el ZIP.";
    console.error(error);
  }
});

// LIMPIAR
clearAllButton.addEventListener("click", () => {
  if (processing) return;

  files = [];
  fileInput.value = "";

  message.textContent = "";
  renderFiles();
});

renderFiles();
</script>

</body>
</html>
